apiVersion: v1
kind: Pod
metadata:
  labels:
    app: nodejs
  name: nodejs-pod
spec:
  containers:
  - command:
    - node
    - /usr/src/app/server.js
    image: node:18
    name: nodejs-pod
    ports:
    - containerPort: 3000
    resources: {}
    volumeMounts:
    - mountPath: /usr/src/app
      name: app-code
  dnsPolicy: ClusterFirst
  restartPolicy: Never
  volumes:
  - configMap:
      name: nodejs-app-config
    name: app-code
status: {}
